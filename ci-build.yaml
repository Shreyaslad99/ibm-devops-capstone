# Root-level copy for course submission. The active workflow is under .github/workflows/.
name: Accounts CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with Flake8
        run: flake8 service tests run.py
      - name: Run unit tests
        run: nosetests --with-coverage --cover-package=service
