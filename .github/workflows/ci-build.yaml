name: Accounts CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # nose 1.3.7 uses collections.Callable, which is unavailable in Python 3.10+.
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with Flake8
        run: flake8 service tests run.py
      - name: Run unit tests
        run: nosetests --with-coverage --cover-package=service

      - name: Build Docker image
        run: docker build -t accounts:latest .

      - name: Capture Docker image details
        shell: bash
        run: |
          mkdir -p submission/generated
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}' accounts:latest | tee submission/generated/kube-images
          docker image inspect accounts:latest --format 'Created (UTC): {{.Created}} | Size (bytes): {{.Size}}' | tee -a submission/generated/kube-images

      - name: Upload kube-images output
        uses: actions/upload-artifact@v4
        with:
          name: kube-images
          path: submission/generated/kube-images

      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kind

      - name: Load image and deploy Accounts service
        run: |
          kind load docker-image accounts:latest
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/accounts --timeout=120s
          kubectl wait --for=condition=Ready pod -l app=accounts --timeout=120s

      - name: Capture Kubernetes deployment details
        shell: bash
        run: |
          mkdir -p submission/generated
          {
            echo "Kubernetes deployment evidence from GitHub-hosted kind cluster"
            echo "Workflow run: https://github.com/Shreyaslad99/ibm-devops-capstone/actions"
            echo
            echo '$ kubectl get deployments -o wide'
            kubectl get deployments -o wide
            echo
            echo '$ kubectl get pods -o wide'
            kubectl get pods -o wide
            echo
            echo '$ kubectl get replicasets -o wide'
            kubectl get replicasets -o wide
            echo
            echo '$ kubectl get services -o wide'
            kubectl get services -o wide
          } 2>&1 | tee submission/generated/kube-deploy-accounts

      - name: Upload kube-deploy-accounts output
        uses: actions/upload-artifact@v4
        with:
          name: kube-deploy-accounts
          path: submission/generated/kube-deploy-accounts
